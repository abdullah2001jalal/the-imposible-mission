name: Trading Bot — EURUSD M15 (Exness MT5 + Gemini 3.8 Flash)

on:
  schedule:
    # Off-peak minutes (avoid :00/:15/:30/:45 congestion where GitHub is known
    # to delay/drop scheduled runs; docs recommend avoiding round times).
    # NOTE: this cron has never fired for this repo (GitHub scheduler bug
    # actions/runner#4210). It is kept as a chain-restarter/watchdog: the real
    # 24/7 engine is the "Re-arm next run" step (self-perpetuating dispatch).
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
    inputs:
      notify_boot:
        description: "Send the success/verification email if this run fully succeeds"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: exness-gemini-trading-bot
  cancel-in-progress: false

jobs:
  trade:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # SELF-PERPETUATING SCHEDULER — bypasses GitHub's broken cron
      # (actions/runner#4210: scheduled runs silently never fire).
      # Each run re-arms the NEXT run via the workflow_dispatch API, so the
      # chain continues 24/7 independently of GitHub's scheduler. Placed
      # EARLY (right after checkout, before the fragile MT5 install) so the
      # chain survives install/bot crashes and runner hangs: a hung job is
      # killed by timeout-minutes and its already-queued successor proceeds.
      # Chain dedupe: if another run is already queued/in progress (cron
      # recovered, external scheduler ping, manual test), it becomes the
      # next link and we skip re-arming -> exactly one chain, never doubled.
      # Free minutes: this repo is PUBLIC, so runner minutes are unlimited.
      # -----------------------------------------------------------------
      - name: Re-arm next run (self-perpetuation; cron bug 4210 workaround)
        if: always()
        shell: pwsh
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
        run: |
          $ErrorActionPreference = 'Continue'
          $headers = @{
            Authorization = "Bearer $env:DEPLOY_PAT"
            Accept        = 'application/vnd.github+json'
            'User-Agent'  = 'trading-bot-selfarm/1.0'
          }
          $pending = 0
          try {
            $runs = Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs?per_page=20" -Headers $headers
            foreach ($r in $runs.workflow_runs) {
              if ([int64]$r.id -eq [int64]$env:GITHUB_RUN_ID) { continue }
              if (@('queued','waiting','pending','in_progress') -contains $r.status) { $pending++ }
            }
            Write-Host "pending successor runs: $pending"
          } catch { Write-Host "run-list check failed: $($_.Exception.Message)" }
          if ($pending -gt 0) {
            Write-Host 'successor already pending -> not re-arming (chain dedupe)'
            exit 0
          }
          # Keep ~15-minute cadence: ~6-8 min of work after this step, so
          # sleep ~8 min here, then dispatch the next run.
          Start-Sleep -Seconds 480
          $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/trading.yml/dispatches"
          $body = '{"ref":"' + $env:GITHUB_REF_NAME + '","inputs":{"notify_boot":false}}'
          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
            try {
              Invoke-RestMethod $url -Method Post -Body $body -ContentType 'application/json' -Headers $headers | Out-Null
              $ok = $true
              Write-Host "next run dispatched (self-perpetuation OK, attempt $i)"
              break
            } catch {
              Write-Host "dispatch attempt $i failed: $($_.Exception.Message)"
              Start-Sleep -Seconds 15
            }
          }
          if (-not $ok) {
            Write-Host '::error::FAILED to re-arm the next run — the run chain will stop'
            exit 1
          }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MetaTrader 5 terminal (silent)
        shell: pwsh
        run: |
          function Find-Terminal {
            Get-ChildItem 'C:\Program Files', 'C:\Program Files (x86)' -Directory -ErrorAction SilentlyContinue |
              ForEach-Object { Join-Path $_.FullName 'terminal64.exe' } |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
          }
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          # Exness-branded terminal first (local Exness server list -> direct
          # auto-login); proven MetaQuotes web installer as fallback.
          $urls = @(
            'https://download.terminal.free/cdn/web/exness.technologies.ltd/mt5/exness5setup.exe',
            'https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe'
          )
          $installed = $null
          foreach ($u in $urls) {
            try {
              Invoke-WebRequest $u -OutFile $installer -UseBasicParsing -TimeoutSec 180
              if ((Get-Item $installer).Length -lt 3MB) { Write-Host "too small from $u, trying next"; continue }
              Write-Host "downloaded from $u"
            } catch { Write-Host "failed from ${u}: $_"; continue }
            $proc = Start-Process -FilePath $installer -ArgumentList '/auto' -Wait -PassThru
            Write-Host "installer exit code: $($proc.ExitCode)"
            Start-Sleep -Seconds 5
            $installed = Find-Terminal
            if ($installed) { break }
            Write-Host "no terminal64.exe after this installer, trying next"
          }
          if (-not $installed) { Write-Host '::error::terminal64.exe NOT found after all installers'; exit 1 }
          Write-Host "terminal64.exe installed at: $installed"
          $ver = (Get-Item $installed).VersionInfo.FileVersion
          Write-Host "installed terminal build: $ver"
          "MT5_PATH=$installed" | Add-Content -Path $env:GITHUB_ENV

          # NOTE: no CDN blocking / build pinning. The Python-side IAT patch
          # (mt5_ipc_patch.py) resolves the IPC handshake for any terminal
          # build, and server-name resolution needs MetaQuotes' index.
          Get-ChildItem "$env:APPDATA\MetaQuotes\Terminal" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            $logdir = Join-Path $_.FullName 'logs'
            if (Test-Path $logdir) {
              Get-ChildItem $logdir -Filter *.log -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending | Select-Object -First 2 | ForEach-Object {
                  Write-Host "--- $($_.Name) ---"
                  Get-Content $_.FullName -Tail 20 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
                }
            }
          }

      - name: Install Python dependencies
        shell: pwsh
        run: pip install --quiet -r requirements.txt

      - name: Run trading bot
        shell: pwsh
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          EXNESS_LOGIN: ${{ secrets.EXNESS_LOGIN }}
          EXNESS_PASSWORD: ${{ secrets.EXNESS_PASSWORD }}
          EXNESS_SERVER: ${{ secrets.EXNESS_SERVER }}
          GEMINI_MODEL: gemini-3.8-flash
          NOTIFY_BOOT: ${{ inputs.notify_boot == true }}
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
          PYTHONFAULTHANDLER: '1'
        run: python -u bot.py

      - name: Commit state.json (key rotation persistence)
        if: always()
        shell: pwsh
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
        run: |
          $ErrorActionPreference = 'Continue'
          git config user.name "gemini-trading-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          $changed = git diff --cached --name-only
          if ($changed -like '*state.json*') {
            git commit -m ("state: rotation update " + (Get-Date -AsUTC -Format 'yyyy-MM-ddTHH:mmZ')) | Out-Null
          }
          for ($i = 0; $i -lt 3; $i++) {
            git pull --rebase origin master 2>$null | Out-Null
            git push "https://x-access-token:$env:DEPLOY_PAT@github.com/$env:GITHUB_REPOSITORY.git" master 2>&1 | ForEach-Object { "$_" }
            if ($LASTEXITCODE -eq 0) { Write-Host 'state.json pushed'; break }
            Start-Sleep -Seconds 8
          }
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::failed to persist state.json'; exit 1 }

      - name: Email operator on any pipeline failure
        if: failure()
        shell: pwsh
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $body = @{
            from = 'onboarding@resend.dev'
            to = @($env:RECEIVER_EMAIL)
            subject = "🚨 Trading bot FAILED during pipeline stage"
            html = "<p>The trading bot workflow failed before/during infrastructure stages (MT5 install, Python setup or state persistence).</p><p>Check: <a href='$runUrl'>$runUrl</a></p>"
          } | ConvertTo-Json
          try {
            Invoke-RestMethod 'https://api.resend.com/emails' -Method Post -Body $body -ContentType 'application/json' -Headers @{ Authorization = "Bearer $env:RESEND_API_KEY" } | Out-Null
            Write-Host 'failure alert emailed'
          } catch {
            Write-Host "failure alert email failed: $_"
          }
