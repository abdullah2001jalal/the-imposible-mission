name: Sentinel v2 — 24/7 Multi-Pair Engine

on:
  schedule:
    # Watchdog/chain-restarter ONLY (GitHub's cron is unreliable:
    # actions/runner#4210). The real scheduler is the self-perpetuating
    # "Re-arm next run" step; the dedupe check prevents double chains.
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sentinel-v2
  cancel-in-progress: false

jobs:
  sentinel:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The alert flag is scratch state for THIS run only: a stale one left in
      # the repo would wrongly suppress the email step below if this run fails
      # in an infra stage before the sentinel ever runs.
      - name: Clear stale per-run scratch
        shell: pwsh
        run: |
          if (Test-Path ALERT_SENT.flag) { Remove-Item ALERT_SENT.flag -Force; Write-Host "stale ALERT_SENT.flag removed" }

      # -----------------------------------------------------------------
      # SELF-PERPETUATING CHAIN — bypasses GitHub's broken cron scheduler.
      # Placed BEFORE the fragile MT5 install so the chain survives crashes.
      # Kill switches (checked in order):
      #   1. config.yml  halt: true        (master switch, edit + commit)
      #   2. engine_status.json halt bit  (previous run's engine verdict)
      # plus chain dedupe: exactly one chain, never doubled.
      # -----------------------------------------------------------------
      - name: Re-arm next run (self-perpetuation; gated by config halt)
        if: always()
        shell: pwsh
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
        run: |
          $ErrorActionPreference = 'Continue'
          $headers = @{
            Authorization = "Bearer $env:DEPLOY_PAT"
            Accept        = 'application/vnd.github+json'
            'User-Agent'  = 'sentinel-v2-selfarm/2.0'
          }
          # --- kill switch 1: config.yml master switch ---
          $halt = $false
          if (Test-Path config.yml) {
            $m = Select-String -Path config.yml -Pattern '^\s*halt\s*:\s*(true|false)' | Select-Object -First 1
            if ($m) { $halt = ($m.Matches[0].Groups[1].Value -eq 'true') }
          }
          Write-Host "config.yml -> halt = $halt"
          # --- kill switch 2: previous run's engine status ---
          if (-not $halt -and (Test-Path engine_status.json)) {
            try {
              $st = Get-Content engine_status.json -Raw | ConvertFrom-Json
              if ($st.halt -eq $true) { $halt = $true; Write-Host "engine_status.json -> halt=$($st.halt)" }
            } catch { Write-Host "engine_status.json unreadable (ignored)" }
          }
          if ($halt) {
            Write-Host '::warning::HALT active -> chain stops here. To restart: set halt:false in config.yml, commit, then run this workflow manually.'
            exit 0
          }
          # --- chain dedupe ---
          $pending = 0
          try {
            $runs = Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs?per_page=20" -Headers $headers
            foreach ($r in $runs.workflow_runs) {
              if ([int64]$r.id -eq [int64]$env:GITHUB_RUN_ID) { continue }
              if (@('queued','waiting','pending','in_progress') -contains $r.status) { $pending++ }
            }
            Write-Host "pending successor runs: $pending"
          } catch { Write-Host "run-list check failed: $($_.Exception.Message)" }
          if ($pending -gt 0) {
            Write-Host 'successor already pending -> not re-arming (chain dedupe)'
            exit 0
          }
          # Keep ~15-minute cadence: ~6-8 min of work after this step, so
          # sleep ~8 min here, then dispatch the next run.
          Start-Sleep -Seconds 480
          $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/trading.yml/dispatches"
          $body = '{"ref":"' + $env:GITHUB_REF_NAME + '"}'
          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
            try {
              Invoke-RestMethod $url -Method Post -Body $body -ContentType 'application/json' -Headers $headers | Out-Null
              $ok = $true
              Write-Host "next run dispatched (self-perpetuation OK, attempt $i)"
              break
            } catch {
              Write-Host "dispatch attempt $i failed: $($_.Exception.Message)"
              Start-Sleep -Seconds 15
            }
          }
          if (-not $ok) {
            Write-Host '::error::FAILED to re-arm the next run — the run chain will stop'
            exit 1
          }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MetaTrader 5 terminal (silent)
        shell: pwsh
        run: |
          function Find-Terminal {
            Get-ChildItem 'C:\Program Files', 'C:\Program Files (x86)' -Directory -ErrorAction SilentlyContinue |
              ForEach-Object { Join-Path $_.FullName 'terminal64.exe' } |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
          }
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $urls = @(
            'https://download.terminal.free/cdn/web/exness.technologies.ltd/mt5/exness5setup.exe',
            'https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe'
          )
          $installed = $null
          foreach ($u in $urls) {
            try {
              Invoke-WebRequest $u -OutFile $installer -UseBasicParsing -TimeoutSec 180
              if ((Get-Item $installer).Length -lt 3MB) { Write-Host "too small from $u, trying next"; continue }
              Write-Host "downloaded from $u"
            } catch { Write-Host "failed from ${u}: $_"; continue }
            $proc = Start-Process -FilePath $installer -ArgumentList '/auto' -Wait -PassThru
            Write-Host "installer exit code: $($proc.ExitCode)"
            Start-Sleep -Seconds 5
            $installed = Find-Terminal
            if ($installed) { break }
            Write-Host "no terminal64.exe after this installer, trying next"
          }
          if (-not $installed) { Write-Host '::error::terminal64.exe NOT found after all installers'; exit 1 }
          Write-Host "terminal64.exe installed at: $installed"
          $ver = (Get-Item $installed).VersionInfo.FileVersion
          Write-Host "installed terminal build: $ver"
          "MT5_PATH=$installed" | Add-Content -Path $env:GITHUB_ENV

      - name: Install Python dependencies
        shell: pwsh
        run: pip install --quiet -r requirements.txt

      - name: Run Sentinel v2 engine
        shell: pwsh
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          EXNESS_LOGIN: ${{ secrets.EXNESS_LOGIN }}
          EXNESS_PASSWORD: ${{ secrets.EXNESS_PASSWORD }}
          EXNESS_SERVER: ${{ secrets.EXNESS_SERVER }}
          MT5_PATH: ${{ env.MT5_PATH }}
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
          PYTHONFAULTHANDLER: '1'
        run: python -u sentinel.py

      - name: Commit persistence (state + journal + engine status)
        if: always()
        shell: pwsh
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
        run: |
          $ErrorActionPreference = 'Continue'
          git config user.name "gemini-trading-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json engine_status.json journal backtest_report.md backtest_report.json 2>$null | Out-Null
          $changed = git diff --cached --name-only 2>$null
          if ("$changed" -ne '') {
            git commit -m ("sentinel-v2: state+journal " + (Get-Date -AsUTC -Format 'yyyy-MM-ddTHH:mmZ')) | Out-Null
          }
          $pushed = $false
          for ($i = 1; $i -le 5; $i++) {
            git fetch origin master 2>$null | Out-Null
            $behind = git rev-list --count HEAD..origin/master 2>$null
            if ("$behind" -ne '' -and [int]$behind -gt 0) {
              git rebase origin/master 2>$null | Out-Null
              if ($LASTEXITCODE -ne 0) {
                # Two runs raced on persistence files -> EXPECTED. state.json
                # / journal / engine_status.json: take the fresher (remote)
                # version; anything else: abort loudly.
                $conflicts = (git diff --name-only --diff-filter=U 2>$null) | Where-Object { $_ -ne '' }
                $resolved = $true
                foreach ($f in $conflicts) {
                  if ($f -eq 'state.json' -or $f -like 'journal/*' -or $f -eq 'engine_status.json') {
                    git checkout --theirs -- $f 2>$null | Out-Null
                    git add -- $f
                  } else { $resolved = $false }
                }
                if ($resolved) {
                  git -c core.editor=true rebase --continue 2>$null | Out-Null
                  if ($LASTEXITCODE -ne 0) { git rebase --skip 2>$null | Out-Null }
                } else {
                  git rebase --abort 2>$null | Out-Null
                }
              }
            }
            git push "https://x-access-token:$env:DEPLOY_PAT@github.com/$env:GITHUB_REPOSITORY.git" master 2>&1 | ForEach-Object { "$_" }
            if ($LASTEXITCODE -eq 0) { Write-Host "persistence pushed (attempt $i)"; $pushed = $true; break }
            Start-Sleep -Seconds 10
          }
          if (-not $pushed) { Write-Host '::error::failed to persist state after 5 attempts'; exit 1 }

      - name: Email operator on failure (unless the sentinel already alerted)
        # always() covers timeout-cancelled runs; !success() narrows to real
        # failure/cancellation. If the sentinel emailed a CRITICAL alert itself
        # it stamps ALERT_SENT.flag -> this step skips to avoid double email.
        if: always() && !success()
        shell: pwsh
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          if (Test-Path ALERT_SENT.flag) {
            Write-Host 'ALERT_SENT.flag present -> sentinel already emailed a CRITICAL alert; skipping duplicate.'
            exit 0
          }
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $body = @{
            from = 'onboarding@resend.dev'
            to = @($env:RECEIVER_EMAIL)
            subject = "🚨 Sentinel v2 FAILED during pipeline stage"
            html = "<p>The Sentinel v2 workflow failed before/during infrastructure stages (MT5 install, Python setup or persistence).</p><p>Check: <a href='$runUrl'>$runUrl</a></p>"
          } | ConvertTo-Json
          try {
            Invoke-RestMethod 'https://api.resend.com/emails' -Method Post -Body $body -ContentType 'application/json' -Headers @{ Authorization = "Bearer $env:RESEND_API_KEY" } | Out-Null
            Write-Host 'failure alert emailed'
          } catch {
            Write-Host "failure alert email failed: $_"
          }
