name: Trading Bot — EURUSD M15 (Exness MT5 + Gemini 3.8 Flash)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      notify_boot:
        description: "Send the success/verification email if this run fully succeeds"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: exness-gemini-trading-bot
  cancel-in-progress: false

jobs:
  trade:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MetaTrader 5 terminal (silent)
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          Invoke-WebRequest 'https://download.mql5.com/cdn/web/metaquotes.softwarecorp/mt5/mt5setup.exe' -OutFile $installer -UseBasicParsing
          Start-Process -FilePath $installer -ArgumentList '/auto' -Wait
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          if (Test-Path 'C:\Program Files\MetaTrader 5\terminal64.exe') {
            Write-Host 'terminal64.exe installed successfully'
          } else {
            Write-Host '::error::terminal64.exe NOT found after silent install'
            exit 1
          }

      - name: Install Python dependencies
        shell: pwsh
        run: pip install --quiet -r requirements.txt

      - name: Run trading bot
        shell: pwsh
        continue-on-error: true
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          EXNESS_LOGIN: ${{ secrets.EXNESS_LOGIN }}
          EXNESS_PASSWORD: ${{ secrets.EXNESS_PASSWORD }}
          EXNESS_SERVER: ${{ secrets.EXNESS_SERVER }}
          GEMINI_MODEL: gemini-3.8-flash
          NOTIFY_BOOT: ${{ inputs.notify_boot == true }}
        run: python bot.py

      - name: Commit state.json (key rotation persistence)
        if: always()
        shell: pwsh
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
        run: |
          $ErrorActionPreference = 'Continue'
          git config user.name "gemini-trading-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          $changed = git diff --cached --name-only
          if ($changed -like '*state.json*') {
            git commit -m ("state: rotation update " + (Get-Date -AsUTC -Format 'yyyy-MM-ddTHH:mmZ')) | Out-Null
          }
          for ($i = 0; $i -lt 3; $i++) {
            git pull --rebase origin main 2>$null | Out-Null
            git push "https://x-access-token:$env:DEPLOY_PAT@github.com/$env:GITHUB_REPOSITORY.git" main 2>&1 | ForEach-Object { "$_" }
            if ($LASTEXITCODE -eq 0) { Write-Host 'state.json pushed'; break }
            Start-Sleep -Seconds 8
          }
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::failed to persist state.json'; exit 1 }

      - name: Email operator on any pipeline failure
        if: failure()
        shell: pwsh
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $body = @{
            from = 'onboarding@resend.dev'
            to = @($env:RECEIVER_EMAIL)
            subject = "🚨 Trading bot FAILED during pipeline stage"
            html = "<p>The trading bot workflow failed before/during infrastructure stages (MT5 install, Python setup or state persistence).</p><p>Check: <a href='$runUrl'>$runUrl</a></p>"
          } | ConvertTo-Json
          try {
            Invoke-RestMethod 'https://api.resend.com/emails' -Method Post -Body $body -ContentType 'application/json' -Headers @{ Authorization = "Bearer $env:RESEND_API_KEY" } | Out-Null
            Write-Host 'failure alert emailed'
          } catch {
            Write-Host "failure alert email failed: $_"
          }
