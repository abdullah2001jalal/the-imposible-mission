# ============================================================================
# SENTINEL v2 — CONTROL PANEL
# واجهة التحكم الكامل محفوظة في المستودع. عدّل ثم اعمل Commit
# والتشغيل القادم (داخل ~15 دقيقة) سيطبقها تلقائياً.
# ============================================================================
# مفتاح الإيقاف الفوري: halt: true => التشغيلات تقرأه وتتوقف عن كل شيء
# والتسلسل الذاتي يموت (لا استهلاك موارد، لا تشغيلات).
halt: true

# وضع التنفيذ:
#   paper => يحسب الإشارات ويسجلها بلا أي أوامر حقيقية (للمشاهدة)
#   demo  => أوامر حقيقية على حساب التريال (الحساب الحالي)
#   live  => حساب حقيقي (لا تغيّر إلا بعد تغيير Secrets للمسجّل الحقيقي!)
mode: demo

# الأزواج (اللاحقة m / غيرها تُحتَل تلقائياً من المنصة — لا تكتب اللاحق)
pairs: [EURUSD, GBPUSD, USDJPY, XAUUSD, BTCUSD]

timeframe: M15

strategy:
  trend_ema_fast: 50
  trend_ema_slow: 200
  breakout_lookback: 24      # انفجار من فقرة 24 شمعة (Donchian)
  atr_period: 14
  sl_atr: 1.5                # مسافة stopwords = 1.5 x ATR
  rr_take: 2.0               # الهدف = 2R
  be_at_r: 1.0               # رفع الستوب إلى التعادل عند +1R
  exit_flip_trend: true      # إغلاق فوري عند انقلاب الترند ضد الموضع
  overrides: {}              # ضبط لكل زوج يسوى فوق الأساس:
                             # overrides: {BTCUSD: {breakout_lookback: 48}}

risk:
  risk_per_trade: 0.006      # 0.6% من حقوق الملكية لكل ضبوة
  max_positions: 4           # أقصى عدد ضبوات مكشوفة في المحفظة
  max_per_pair: 1
  day_stop_pnl: -0.015       # إيقاف اليوم بعد خسارة يومية -1.5%
  cooldown_bars_after_loss: 2   # تبريد بعد ضبوة خاسرة مغلقة

limits:
  max_spread_atr_frac: 0.15  # تخطي الإدخال إن السبريد > 15% من ATR
  trading_hours_utc: [7, 21]
  skip_friday_after_utc: 20

alerts:
  email_on_order: true
  daily_summary_utc_hour: 21
